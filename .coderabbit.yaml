# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "ko-KR"
early_access: false

tone_instructions: >-
  모든 리뷰와 PR 요약은 한국어로 작성하세요. Java 21과 Spring Boot 기반 백엔드를
  검토하는 시니어 개발자 관점에서 실제 오류, 보안 문제, 데이터 무결성, 트랜잭션 경계,
  유지보수성에 영향을 주는 사항을 우선하세요. 지적에는 근거와 재현 가능한 상황을
  설명하고, 필요한 경우 최소한의 수정 예시를 제시하세요. 단순 취향 차이나 근거 없는
  리팩터링은 차단 의견으로 남기지 마세요.

reviews:
  profile: "assertive"
  request_changes_workflow: false

  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  changed_files_summary: true
  collapse_walkthrough: true
  sequence_diagrams: true
  review_status: true
  poem: false

  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false

  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/*.class"
    - "!**/*.jar"
    - "!**/*.min.*"
    - "!**/.DS_Store"

  path_instructions:
    - path: "src/main/java/**/*.java"
      instructions: |
        Java 21과 Spring Boot 프로젝트 코드입니다.
        - null 처리, 예외 흐름, 리소스 누수, 동시성 문제처럼 실제 장애로 이어질 수 있는 부분을 우선 검토하세요.
        - 생성자 주입을 우선하고, 순환 의존성과 과도한 컴포넌트 결합을 확인하세요.
        - 공개 메서드라는 이유만으로 JavaDoc을 요구하지 마세요. 계약이나 의도가 코드만으로 명확하지 않은 공개 API에만 문서화를 제안하세요.
        - 하드코딩된 값은 의미가 있거나 여러 곳에서 재사용될 때만 상수화를 제안하세요.
        - 로그와 예외 응답에 비밀번호, 토큰, 개인정보, 내부 시스템 정보가 노출되지 않는지 확인하세요.

    - path: "src/main/java/**/*Controller.java"
      instructions: |
        HTTP 상태 코드와 메서드가 REST 의미에 맞는지, 요청 DTO에 Bean Validation이 적용됐는지 확인하세요.
        응답은 프로젝트의 ApiResponse 형식을 일관되게 사용해야 하며, 도메인 로직이 컨트롤러에 들어가지 않도록 검토하세요.

    - path: "src/main/java/**/apiPayload/**/*.java"
      instructions: |
        성공·실패 응답의 HTTP 상태, 서비스 코드, 메시지, result 타입이 일관적인지 확인하세요.
        예상하지 못한 예외의 메시지나 스택 트레이스가 클라이언트에 노출되지 않아야 합니다.
        검증 오류가 여러 개인 경우 정보가 의도치 않게 유실되는지도 확인하세요.

    - path: "src/main/java/**/entity/**/*.java"
      instructions: |
        JPA 엔티티와 Flyway 스키마의 컬럼명, null 허용 여부, 길이, 정밀도, 기본값이 일치하는지 확인하세요.
        연관관계의 주인, 지연 로딩, N+1 가능성, 영속성 전파 범위와 삭제 정책을 검토하세요.
        엔티티에는 Lombok @Data와 무분별한 setter 사용을 피하고, 식별자 기반 equals/hashCode가 프록시에서 안전한지 확인하세요.
        created_at, updated_at, deleted_at처럼 반복되는 감사 컬럼은 BaseEntity 정책과 일치해야 합니다.

    - path: "src/main/java/**/repository/**/*.java"
      instructions: |
        파생 쿼리와 JPQL이 소프트 삭제된 행을 올바르게 처리하는지, 페이지 조회와 조인에서 N+1 및 불필요한 전체 조회가 없는지 확인하세요.
        실제 조회 조건에 필요한 인덱스가 Flyway 마이그레이션에 정의됐는지도 확인하세요.

    - path: "src/main/java/**/service/**/*.java"
      instructions: |
        트랜잭션 경계와 readOnly 설정, 경쟁 상태, 중복 요청의 멱등성, 도메인 불변식 보존을 중점적으로 확인하세요.
        외부 API 호출과 데이터베이스 트랜잭션을 불필요하게 길게 묶지 않도록 검토하세요.

    - path: "src/main/java/**/auth/**/*.java"
      instructions: |
        소셜 로그인 토큰의 서명, issuer, audience, 만료 시각을 검증하는지 확인하세요.
        JWT와 Refresh Token의 수명, 재발급, 폐기, 탈취 대응이 일관적인지 검토하고 토큰이나 OAuth 비밀값이 로그에 남지 않게 하세요.

    - path: "src/main/java/**/security/**/*.java"
      instructions: |
        인증·인가가 기본적으로 거부되는 구조인지, 공개 엔드포인트 범위가 과도하지 않은지, CORS와 CSRF 설정이 배포 방식에 맞는지 확인하세요.
        보안 필터 예외가 공통 응답 형식과 올바른 HTTP 상태로 반환되는지도 검토하세요.

    - path: "src/main/resources/db/migration/**/*.sql"
      instructions: |
        MySQL 8.4와 Flyway 기준으로 검토하세요. 이미 배포된 버전 마이그레이션은 수정하지 않고 새 파일로 변경해야 합니다.
        PK, FK, UNIQUE, 인덱스, 문자 길이, null 허용 여부와 DATETIME 정밀도가 엔티티 및 ERD와 일치하는지 확인하세요.
        기존 데이터가 있는 환경에서도 안전하게 실행되는지와 롤링 배포 중 호환성을 검토하세요.

    - path: "src/main/resources/application*.yaml"
      instructions: |
        비밀번호, JWT secret, OAuth 자격증명, AWS 키와 버킷별 민감값을 커밋하지 않도록 확인하세요.
        환경 변수 기본값이 운영 환경에서 안전한지, 프로파일별 설정 우선순위와 타입이 올바른지 검토하세요.

    - path: "src/test/**/*.java"
      instructions: |
        정상 경로만 반복하는 테스트보다 경계값, 검증 실패, 권한 실패, 중복 요청과 예외 응답 계약을 검증하는지 확인하세요.
        구현 세부사항을 그대로 복제한 테스트와 과도한 mocking은 지양하고, 테스트가 서로의 실행 순서나 공유 상태에 의존하지 않게 하세요.

    - path: ".github/workflows/*.{yml,yaml}"
      instructions: |
        GitHub Actions 권한은 최소 범위인지, 외부 입력이 셸 명령에 안전하게 전달되는지, 비밀값이 로그에 노출되지 않는지 확인하세요.
        self-hosted runner 작업이 신뢰할 수 없는 PR 코드에서 실행되지 않는지와 배포 작업이 develop 브랜치 조건을 지키는지 검토하세요.

    - path: "Dockerfile"
      instructions: |
        ARM64 라즈베리파이 배포와 Java 21 실행을 고려하세요. 이미지 계층, 비루트 사용자, 민감정보 포함 여부, 헬스체크와 종료 신호 처리를 검토하세요.

    - path: "deploy/**/*.sh"
      instructions: |
        set -euo pipefail 사용, 변수 인용, 실패 시 동작, GHCR 로그인 정보 노출 여부와 재배포의 멱등성을 확인하세요.
        데이터 볼륨을 삭제하거나 서비스 전체를 불필요하게 중단하는 명령은 높은 위험도로 검토하세요.

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - "main"
      - "develop"
    ignore_title_keywords: []
    labels: []

  tools:
    pmd:
      enabled: true
    shellcheck:
      enabled: true
    hadolint:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
  learnings:
    scope: "local"
  issues:
    scope: "local"
  pull_requests:
    scope: "local"
