# Gradle test 태스크가 spring.profiles.active=test를 주입해 이 설정을 활성화한다.
spring:
  datasource:
    # CI는 이 기본값(3306/moeasy)의 서비스 컨테이너로 접속한다. 로컬 포트가 다르면(예: 3307)
    # .env의 DB_URL로 덮어써서 쓴다 — 새 환경변수를 따로 만들지 않는다.
    url: ${DB_URL:jdbc:mysql://localhost:3306/moeasy?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:moeasy}
    password: ${DB_PASSWORD:moeasy1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # @SpringBootTest 컨텍스트가 여러 개 캐시되는 전체 테스트에서 각 컨텍스트가
      # 기본 풀(최대 10개)을 유지하면 CI MySQL의 max_connections를 압박할 수 있다.
      # 동시성 요청은 풀에서 대기할 수 있으므로 전체 테스트 JVM의 커넥션 수를 우선 제한한다.
      maximum-pool-size: 8
      # 유휴 커넥션을 컨텍스트마다 미리 확보하지 않는다.
      minimum-idle: 0

  jpa:
    hibernate:
      # 운영과 같은 경로로 검증한다. 스키마는 Flyway(db/migration)가 만들고 Hibernate는 대조만 한다.
      # 그래야 "마이그레이션이 엔티티와 맞는가"를 CI가 매번 확인해 준다.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}

  # 테스트에는 로컬 더미(db/dummy)를 넣지 않는다. 테스트는 각자 필요한 데이터를 직접 만들고,
  # 고정 id를 가진 더미 행이 섞이면 건수 검증 같은 단언이 흔들린다.
  # (locations를 명시하지 않으면 application.yaml의 db/migration만 적용된다.)

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jwt:
  secret: ${JWT_SECRET:test-only-jwt-secret-key-with-at-least-32-bytes}

oauth:
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:test-kakao-rest-api-key}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    token-uri: ${KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
    user-info-uri: ${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}
  google:
    web-client-id: ${GOOGLE_WEB_CLIENT_ID:test-google-client-id}
    client-secret: ${GOOGLE_CLIENT_SECRET:test-google-client-secret}
    token-uri: ${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
    user-info-uri: ${GOOGLE_USER_INFO_URI:https://openidconnect.googleapis.com/v1/userinfo}

# 테스트 프로파일은 실제 AWS 자격증명이나 Bucket 없이도 S3 설정을 바인딩할 수 있도록
# 비실재 bucket 이름을 사용한다. S3 호출 동작은 공통 서비스 단위 테스트에서 mock으로 검증한다.
aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET:test-bucket}
    upload-presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:PT5M}
    download-presigned-url-expiration: ${AWS_S3_VIEW_URL_EXPIRATION:PT15M}

# 통합 테스트에서는 레이트 리밋을 끈다(#23). 카운터가 Redis에 남아 테스트 간에 누적되면
# 실행 순서에 따라 결과가 달라진다. 제한이 실제로 걸리는지는 RateLimitIntegrationTest가
# @TestPropertySource로 다시 켜서 검증한다.
rate-limit:
  enabled: false

# 도메인 기능이 추가될 때까지 AI 보류 정책은 기존 테스트 동작을 유지한다.
ai:
  review:
    pending:
      enabled: false
